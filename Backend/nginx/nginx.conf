# PitGo — reverse proxy (5 domen, HTTPS bilan).
#   api.pitgo.uz          -> backend (NestJS API + /v1/ws WebSocket + /uploads)
#   admin.pitgo.uz        -> admin (Next.js)
#   media.pitgo.uz        -> APK va statik fayllar (yuklab olish)
#   pitgo.uz, www.pitgo.uz -> landing (Next.js, marketing sayt)

upstream pitgo_backend { server backend:8080; }
upstream pitgo_admin   { server admin:3000; }
upstream pitgo_landing { server landing:3000; }

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------- HTTP -> HTTPS redirect (+ ACME challenge) ----------
server {
    listen 80;
    server_name api.pitgo.uz admin.pitgo.uz media.pitgo.uz pitgo.uz www.pitgo.uz;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---------- API: api.pitgo.uz ----------
server {
    listen 443 ssl;
    http2 on;
    server_name api.pitgo.uz;
    ssl_certificate     /etc/letsencrypt/live/api.pitgo.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.pitgo.uz/privkey.pem;
    client_max_body_size 25m;

    # WebSocket — real-time SOS
    location /v1/ws {
        proxy_pass http://pitgo_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://pitgo_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------- Admin: admin.pitgo.uz ----------
server {
    listen 443 ssl;
    http2 on;
    server_name admin.pitgo.uz;
    ssl_certificate     /etc/letsencrypt/live/api.pitgo.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.pitgo.uz/privkey.pem;
    client_max_body_size 25m;

    location / {
        proxy_pass http://pitgo_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------- Media/APK: media.pitgo.uz ----------
server {
    listen 443 ssl;
    http2 on;
    server_name media.pitgo.uz;
    ssl_certificate     /etc/letsencrypt/live/api.pitgo.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.pitgo.uz/privkey.pem;
    client_max_body_size 200m;

    root /usr/share/nginx/media;
    index index.html;

    location ~* \.apk$ {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# ---------- Landing: pitgo.uz, www.pitgo.uz ----------
server {
    listen 443 ssl;
    http2 on;
    server_name pitgo.uz www.pitgo.uz;
    ssl_certificate     /etc/letsencrypt/live/api.pitgo.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.pitgo.uz/privkey.pem;
    client_max_body_size 10m;

    location / {
        proxy_pass http://pitgo_landing;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
