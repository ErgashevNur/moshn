services:
  postgres-dev:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: pitgo
      POSTGRES_USER: pitgo
      POSTGRES_PASSWORD: pitgo_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitgo -d pitgo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata_dev:
