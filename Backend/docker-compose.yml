services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pitgo}
      POSTGRES_USER: ${DB_USER:-pitgo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env da kerak}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pitgo} -d ${DB_NAME:-pitgo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./nest-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-pitgo}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-pitgo}
      - JWT_SECRET=${JWT_SECRET}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - UZBEKVOICE_API_KEY=${UZBEKVOICE_API_KEY}
      - FIREBASE_SERVICE_ACCOUNT=${FIREBASE_SERVICE_ACCOUNT}
      - YANDEX_MAPS_API_KEY=${YANDEX_MAPS_API_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - ESKIZ_EMAIL=${ESKIZ_EMAIL}
      - ESKIZ_PASSWORD=${ESKIZ_PASSWORD}
      - PORT=8080
      - NODE_ENV=production
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    volumes:
      - uploads:/app/uploads

  admin:
    build:
      context: ./admin
      args:
        # Brauzer admin API'ga shu URL orqali ulanadi (build vaqtida bekitiladi).
        # Nginx orqali bir xil originda bo'lsa "/v1" yetarli.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/v1}
    restart: unless-stopped
    depends_on:
      - backend

  landing:
    build:
      context: ../Landing
      args:
        NEXT_PUBLIC_APK_URL: ${NEXT_PUBLIC_APK_URL:-https://media.pitgo.uz/pitgo-2.2.0.apk}
        NEXT_PUBLIC_APK_PRO_URL: ${NEXT_PUBLIC_APK_PRO_URL:-https://media.pitgo.uz/pitgo-pro-2.2.0.apk}
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
      - admin
      - landing
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./media:/usr/share/nginx/media:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  pgdata:
  uploads:
